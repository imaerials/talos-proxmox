# Genera un ConfigMap por dashboard (el total supera el límite de 256KB
# de un solo ConfigMap). El label grafana_dashboard=1 es lo que mira el
# sidecar de Grafana (grafana/values.yaml, ver DASHBOARDS.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
# 1860.json pesa ~670KB: sin esto kubectl agrega last-applied-configuration
# (una copia del objeto) y el ConfigMap supera el límite de 256KB.
# Con skipLastApplied hay que aplicar con kubectl apply siempre, nunca create.
  annotations:
    kubectl.kubernetes.io/skipLastApplied: "true"
resources: []
configMapGenerator:
  - name: dashboard-15757
    namespace: grafana
    files:
      - 15757.json
  - name: dashboard-15758
    namespace: grafana
    files:
      - 15758.json
  - name: dashboard-15759
    namespace: grafana
    files:
      - 15759.json
  - name: dashboard-1860
    namespace: grafana
    files:
      - 1860.json
  - name: dashboard-747
    namespace: grafana
    files:
      - 747.json