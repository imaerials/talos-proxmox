# kube-prometheus-stack 91.4.1 (Prometheus v3.x)
# Referencia de values: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
defaultRules:
  create: true

# Prometheus con storage propio en Longhorn (retención de datos)
prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Alertmanager con storage propio
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# Sin Grafana: ya está instalado aparte (grafana/)
grafana:
  enabled: false

# Alta disponibilidad liviana para el lab
prometheusOperator:
  resources:
    limits:
      memory: 512Mi

coreDns:
  enabled: true
kubeDns:
  enabled: false
kubeControllerManager:
  enabled: true
kubeEtcd:
  enabled: true
kubeScheduler:
  enabled: true
kubeApiServer:
  enabled: true
kubeProxy:
  enabled: true
kubelet:
  enabled: true

# node-exporter: en Talos no se puede montar / de la VM como en un host Linux
# (no hay sistema de archivos raíz visible), así que se dejan solo las métricas
# estándar del kubelet/cgroup que sí funcionan.
nodeExporter:
  enabled: true