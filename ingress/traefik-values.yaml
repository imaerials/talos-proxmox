# traefik/traefik 41.6.0 (Traefik v3.7.13)
service:
  annotations:
    metallb.io/loadBalancerIPs: 192.168.68.200

ingressClass:
  enabled: true
  isDefaultClass: true

# http → https
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
