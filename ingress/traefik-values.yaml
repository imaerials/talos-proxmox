# traefik/traefik 41.6.0 (Traefik v3.7.13)
service:
  annotations:
    metallb.io/loadBalancerIPs: 192.168.68.200

ingressClass:
  enabled: true
  isDefaultClass: true

# http → https
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

# Dashboard en https://traefik.192.168.68.200.nip.io/dashboard/ (sin autenticación:
# visible para toda la LAN).
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.192.168.68.200.nip.io`)
    entryPoints: [websecure]

# HA: 2 réplicas, una por worker (DoNotSchedule).
# - matchLabelKeys pod-template-hash: cada revisión se reparte por separado,
#   así el pod extra del rolling update (maxSurge) no queda Pending.
# - nodeTaintsPolicy Honor: el control plane y los nodos caídos (con taint)
#   no cuentan; si cae un worker, la réplica se reprograma en el otro.
deployment:
  replicas: 2

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    matchLabelKeys: [pod-template-hash]
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik
